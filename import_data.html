async function startImport(){
  document.getElementById('btn').disabled=true;
  var teams=Object.keys(DATA);
  var total=teams.length;
  
  for(var t=0;t<teams.length;t++){
    var teamName=teams[t];
    var cfg=DATA[teamName].config;
    var data=DATA[teamName].data;
    var cp=cfg[0],ca=cfg[1];
    
    log('--- '+teamName+' ---','info');
    
    // Delete existing players
    try{
      var snap=await db.collection(cp).get();
      for(var d of snap.docs)await db.collection(cp).doc(d.id).delete();
    }catch(e){}
    
    // Import players - store with fixed ID based on name
    var playerIdMap={};
    for(var i=0;i<data.players.length;i++){
      var p=data.players[i];
      var pid=uid();
      playerIdMap[p.name]=pid;
      await db.collection(cp).doc(pid).set({
        name:p.name,num:p.num||'',pos:p.pos||'',st:p.st||'active',
        birth:p.birth||'',phone:p.phone||'',notes:p.notes||''
      });
    }
    log('✓ '+data.players.length+' παίκτες','ok');
    
    // Delete existing attendance
    try{
      var asnap=await db.collection(ca).get();
      for(var d of asnap.docs)await db.collection(ca).doc(d.id).delete();
    }catch(e){}
    
    // Import attendance using player IDs
    var attCount=0;
    for(var i=0;i<data.attendance.length;i++){
      var sess=data.attendance[i];
      var attObj={};
      sess.entries.forEach(function(e){
        var pid=playerIdMap[e.player];
        if(pid)attObj[pid]=e.status;
      });
      if(Object.keys(attObj).length>0){
        await db.collection(ca).add({date:sess.date,topic:sess.topic,snotes:'',att:attObj});
        attCount++;
      }
    }
    log('✓ '+attCount+' προπονήσεις','ok');
    
    setProgress((t+1)/total*100);
  }
  
  log('','');
  log('✅ Εισαγωγή ολοκληρώθηκε! Μπορείς να κλείσεις αυτή τη σελίδα.','ok');
  document.getElementById('btn').textContent='✅ Ολοκληρώθηκε!';
}
